<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1424" width="900" height="1424" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">孩子 15 岁了，16、17 岁的补助还拿得到吗？</title>
<desc id="d">16、17 岁拿基本补助，要在孩子 15 岁那年 12 月 31 日之前满足任意一条：累计存入至少 2,000 且未取出，或任意 4 个年度每年至少存 100 且未取出。</desc>
<rect width="900" height="1424" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 16、17 岁补助的条件</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">孩子 15 岁了，16、17 岁的补助还拿得到吗？</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">拿得到，但要先过一道门：孩子 15 岁那年 12 月 31 日之前，下面两条满足任意</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">一条，并且这些钱没有取出。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">两条门槛，满足任意一条（钱要留在账户里）</text>
<rect x="40.0" y="362" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">第一条：累计存满 2,000</text>
<circle cx="64.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子 15 岁那年年底之前，所有 RESP 合计至少</text>
<text x="76.0" y="448" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">存入 2,000</text>
<circle cx="64.0" cy="473" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="478" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">取出过的钱不算，要一直留在账户里</text>
<rect x="459.0" y="362" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">第二条：4 个年度，每年至少 100</text>
<circle cx="483.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">15 岁那年年底之前，任意 4 个年度每年至少存</text>
<text x="495.0" y="448" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">100</text>
<circle cx="483.0" cy="473" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="478" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">同样要求没有取出</text>
<text x="40" y="548" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">过了门之后</text>
<rect x="40.0" y="566" width="401.0" height="162" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="58.0" y="599" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">15、16、17 岁三年</text>
<circle cx="64.0" cy="623" r="3.2" fill="#B7791F"/>
<text x="76.0" y="628" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">有未用额度时每年最多拿 1,000 的基本补助，</text>
<text x="76.0" y="652" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">没有时 500</text>
<circle cx="64.0" cy="677" r="3.2" fill="#B7791F"/>
<text x="76.0" y="682" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">17 岁那年年底是最后一年，之后的供款不再配</text>
<text x="76.0" y="706" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">补助</text>
<rect x="459.0" y="566" width="401.0" height="162" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="477.0" y="599" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">额外补助与学习债券</text>
<circle cx="483.0" cy="623" r="3.2" fill="#B7791F"/>
<text x="495.0" y="628" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">额外补助跟着基本补助走：16、17 岁拿不到基</text>
<text x="495.0" y="652" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">本补助，额外补助也拿不到</text>
<circle cx="483.0" cy="677" r="3.2" fill="#B7791F"/>
<text x="495.0" y="682" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">学习债券不需要供款，也不受这两条限制</text>
<text x="40" y="776" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">同样 16 岁才想起 RESP，两个家庭的结果</text>
<rect x="40.0" y="794" width="401.0" height="168" rx="14" fill="#E8F5EE" stroke="#1B7F4B" stroke-width="1.5"/>
<text x="58.0" y="827" font-size="19" fill="#1B7F4B" font-weight="700" text-anchor="start">A 家：门票早就有了</text>
<circle cx="64.0" cy="851" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="856" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子 5 岁开户，存了四年、每年 300，后来断</text>
<text x="76.0" y="880" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">了</text>
<circle cx="64.0" cy="905" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="910" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">四个年度每年至少 100，第二条满足</text>
<circle cx="64.0" cy="935" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="940" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">16 岁再存 5,000，有未用额度时拿 1,000</text>
<rect x="459.0" y="794" width="401.0" height="168" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="477.0" y="827" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">B 家：一条也不满足</text>
<circle cx="483.0" cy="851" r="3.2" fill="#B42318"/>
<text x="495.0" y="856" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子 12 岁开户，存了 1,500，一年后取出</text>
<circle cx="483.0" cy="881" r="3.2" fill="#B42318"/>
<text x="495.0" y="886" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">累计没到 2,000，取出的钱又不算</text>
<circle cx="483.0" cy="911" r="3.2" fill="#B42318"/>
<text x="495.0" y="916" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">16 岁再存多少，都没有补助</text>
<text x="40" y="1010" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">现在该做什么</text>
<rect x="40" y="1028" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1042" width="100.60000000000001" height="34" rx="17" fill="#12355B"/>
<text x="104.30000000000001" y="1065" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">13–14 岁</text>
<text x="172.60000000000002" y="1064" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">还没开户的，今年就开</text>
<text x="172.60000000000002" y="1090" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">此时开户凑不满 4 个年度，要走累计存满 2,000 这条。</text>
<rect x="40" y="1123" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1137" width="97.0" height="34" rx="17" fill="#12355B"/>
<text x="102.5" y="1160" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">15 岁那年</text>
<text x="169.0" y="1159" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">12 月 31 日前存到 2,000 以上</text>
<text x="169.0" y="1185" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">存进去的钱不要取出；有未用额度的，直接存到 5,000，当年拿 1,000 并同时满足条</text>
<text x="169.0" y="1210" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">件。</text>
<rect x="40" y="1243" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1257" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="1280" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">已开户</text>
<text x="146" y="1279" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">前几年存得少的，核对有没有 4 个年度的记录</text>
<text x="146" y="1305" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有，就按第一条补足；换机构时请新机构确认历史供款记录完整带过去。</text>
<text x="40" y="1361" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《RESP 能加多少钱》；《加拿大教育储蓄法》；canada.ca《加拿大学习债券》。</text>
<text x="40" y="1381" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
