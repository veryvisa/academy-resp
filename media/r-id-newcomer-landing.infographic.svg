<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1354" width="900" height="1354" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">刚落地加拿大第一年，RESP 该排第几？</title>
<desc id="d">落地第一年的先后次序：办 SIN、申请儿童福利金、第二年春天夫妻都报税、安顿后开户并勾上所有补助；13、14 岁的孩子要排好 15 岁年底前的供款。</desc>
<rect width="900" height="1354" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 新移民落地第一年</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">刚落地加拿大第一年，RESP 该排第几？</text>
<rect x="40" y="166" width="820" height="98" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不必急着存满，但有两件事要排在前面：报税，和大孩子 15 岁那年的年底截止线。</text>
<text x="40" y="312" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">落地后的次序</text>
<rect x="40" y="330" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="344" width="93.1" height="34" rx="17" fill="#12355B"/>
<text x="100.55" y="367" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 1 个月</text>
<text x="165.1" y="366" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">全家办 SIN</text>
<text x="165.1" y="392" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开 RESP 要孩子和开户人都有 SIN；申请额外补助、学习债券还要主要照护人的 SIN</text>
<text x="165.1" y="417" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">与签名。临时居民的孩子拿 9 开头的临时 SIN，到期日跟着许可走。</text>
<rect x="40" y="450" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="464" width="88" height="34" rx="17" fill="#12355B"/>
<text x="98.0" y="487" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">头几个月</text>
<text x="160" y="486" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">符合条件就申请儿童福利金（CCB）</text>
<text x="160" y="512" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">学习债券要求主要照护人已报税、有 CCB 资格。永居落地的符合身份条件；临时居民要</text>
<text x="160" y="537" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">连续居住 18 个月、第 19 个月持有效许可。</text>
<rect x="40" y="570" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="584" width="103" height="34" rx="17" fill="#12355B"/>
<text x="105.5" y="607" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第二年春天</text>
<text x="175" y="606" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">夫妻都报税，哪怕收入很低</text>
<text x="175" y="632" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">额外补助和学习债券按报税算出的家庭净收入判定，不报税就无从判定。第一年只有半</text>
<text x="175" y="657" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">年收入的家庭，往往正好落在收入线以下。</text>
<rect x="40" y="690" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="704" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="727" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">安顿后</text>
<text x="146" y="726" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">开户，把所有补助都勾上</text>
<text x="146" y="752" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">基本补助、额外补助、学习债券和所在省的项目都要勾，需要照护人签名的地方要签；手头</text>
<text x="146" y="777" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">紧可以先少存，学习债券不需要供款。</text>
<text x="40" y="842" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">2026 年的收入线（调整后家庭净收入）</text>
<rect x="40.0" y="860" width="401.0" height="144" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="893" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">额外补助</text>
<circle cx="64.0" cy="917" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="922" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">58,523 以下：头 500 的供款多加 20%</text>
<circle cx="64.0" cy="947" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="952" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">58,523 到 117,045：多加 10%</text>
<circle cx="64.0" cy="977" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="982" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">额外补助不能结转，当年不存就没了</text>
<rect x="459.0" y="860" width="401.0" height="144" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="893" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">学习债券（2026 年 7 月起的福利年）</text>
<circle cx="483.0" cy="917" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="922" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">1 到 3 个孩子的家庭，收入线 58,523</text>
<circle cx="483.0" cy="947" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="952" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不需要供款，首年 500，终身最多 2,000</text>
<text x="40" y="1052" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">落地第一年最紧的两件事</text>
<rect x="40.0" y="1070" width="401.0" height="162" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="58.0" y="1103" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">孩子已经 13、14 岁</text>
<circle cx="64.0" cy="1127" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1132" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">16、17 岁要拿补助，须在 15 岁那年年底前累</text>
<text x="76.0" y="1156" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">计存满 2,000（未取出），或有 4 个年度每年</text>
<text x="76.0" y="1180" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">至少存 100</text>
<circle cx="64.0" cy="1205" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1210" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">这条有硬截止，不能往后推</text>
<rect x="459.0" y="1070" width="401.0" height="162" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="477.0" y="1103" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">额度从哪年算</text>
<circle cx="483.0" cy="1127" r="3.2" fill="#B7791F"/>
<text x="495.0" y="1132" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">ESDC 给机构的指引从出生年累积；法条字面把</text>
<text x="495.0" y="1156" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">整年不是加拿大居民的年份排除在外</text>
<circle cx="483.0" cy="1181" r="3.2" fill="#B7791F"/>
<text x="495.0" y="1186" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">以机构替你查到的系统可用额度为准</text>
<text x="40" y="1271" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《开 RESP 的步骤》《RESP 能加多少钱》《加拿大学习债券》；CRA《CCB 申请前须知》；ESDC 2026 年额外补助</text>
<text x="40" y="1291" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">收入线公告。</text>
<text x="40" y="1311" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
