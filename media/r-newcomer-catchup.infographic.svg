<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1379" width="900" height="1379" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">刚来加拿大，还能追回多少补助？</title>
<desc id="d">领补助不看永居，看 SIN 和供款时是不是加拿大居民。落地前那些年的额度算不算有两种官方口径，以机构查到的系统额度为准，每年最多追 1,000。</desc>
<rect width="900" height="1379" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 新移民家庭的补助追补</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">刚来加拿大，还能追回多少补助？</text>
<rect x="40" y="166" width="820" height="136" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">领补助不看永居，看 SIN 和供款时是不是加拿大居民。落地前那些年的额度算不</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">算有两种官方口径，以机构查到的系统额度为准，每年最多追 1,000。</text>
<text x="40" y="350" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">额度从哪年算：两种官方口径</text>
<rect x="40.0" y="368" width="401.0" height="126" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="401" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">ESDC 给机构的指引</text>
<circle cx="64.0" cy="420" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="425" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">额度从孩子出生那年起累积</text>
<circle cx="64.0" cy="450" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="455" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">没开户也照样累积</text>
<rect x="459.0" y="368" width="401.0" height="126" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="477.0" y="401" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">法条字面</text>
<circle cx="483.0" cy="420" r="3.2" fill="#B7791F"/>
<text x="495.0" y="425" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">整年不是加拿大居民的年份不计额度</text>
<circle cx="483.0" cy="450" r="3.2" fill="#B7791F"/>
<text x="495.0" y="455" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">落地当年整年计入</text>
<text x="40" y="542" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">追补的节奏</text>
<rect x="40.0" y="560" width="401.0" height="156" rx="14" fill="#E8F5EE" stroke="#1B7F4B" stroke-width="1.5"/>
<text x="58.0" y="593" font-size="19" fill="#1B7F4B" font-weight="700" text-anchor="start">每年能补多少</text>
<circle cx="64.0" cy="612" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="617" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">每年新增 500 额度</text>
<circle cx="64.0" cy="642" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="647" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">有未用额度时，单年最多拿 1,000（要存 5,000）</text>
<circle cx="64.0" cy="672" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="677" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">终身最多 7,200；多存不多给补助</text>
<rect x="459.0" y="560" width="401.0" height="156" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="593" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">最晚几岁开始还能拿满</text>
<circle cx="483.0" cy="612" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="617" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">按 ESDC 口径：最晚 10 岁开始、每年存到 </text>
<text x="495.0" y="641" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">5,000，17 岁那年能拿满 7,200</text>
<circle cx="483.0" cy="666" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="671" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">按法条口径，落地晚的孩子额度更少</text>
<text x="40" y="764" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">两道硬截止</text>
<rect x="40.0" y="782" width="401.0" height="150" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="58.0" y="815" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">16、17 岁的门槛</text>
<circle cx="64.0" cy="834" r="3.2" fill="#B42318"/>
<text x="76.0" y="839" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">15 岁那年 12 月 31 日前累计存满 2,000，或</text>
<text x="76.0" y="863" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">4 个年度每年至少 100</text>
<circle cx="64.0" cy="888" r="3.2" fill="#B42318"/>
<text x="76.0" y="893" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">这些钱都不能取出</text>
<rect x="459.0" y="782" width="401.0" height="150" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="477.0" y="815" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">BC 省 BCTESG 1,200</text>
<circle cx="483.0" cy="834" r="3.2" fill="#B42318"/>
<text x="495.0" y="839" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">6 岁生日起，到 9 岁生日前一天申请；满 9 岁</text>
<text x="495.0" y="863" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">就过了窗口</text>
<circle cx="483.0" cy="888" r="3.2" fill="#B42318"/>
<text x="495.0" y="893" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BC 省已宣布：2028 年 4 月 1 日起终止</text>
<text x="40" y="980" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">现在该做什么</text>
<rect x="40" y="998" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1012" width="79.0" height="34" rx="17" fill="#12355B"/>
<text x="93.5" y="1035" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第一步</text>
<text x="151.0" y="1034" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">请机构查孩子的可用额度</text>
<text x="151.0" y="1060" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">两种口径差距可能很大，追补前以系统里显示的额度为准。</text>
<rect x="40" y="1093" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1107" width="64.0" height="34" rx="17" fill="#12355B"/>
<text x="86.0" y="1130" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">每年</text>
<text x="136.0" y="1129" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">按额度存到刚好拿满</text>
<text x="136.0" y="1155" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">有未用额度存 5,000 拿 1,000；没有就存 2,500 拿 500。</text>
<rect x="40" y="1188" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1202" width="64.0" height="34" rx="17" fill="#12355B"/>
<text x="86.0" y="1225" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">报税</text>
<text x="136.0" y="1224" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">落地后按时报税</text>
<text x="136.0" y="1250" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">学习债券和额外补助都按报税结果判定，收入低的第一年也要报。</text>
<text x="40" y="1309" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《RESP 能加多少钱》；ESDC Infocapsule 12（额度与结转）；《加拿大教育储蓄法》；BC 省 BCTESG 页；BC 2026 </text>
<text x="40" y="1329" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">年预算与财政计划。</text>
<text x="40" y="1349" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
