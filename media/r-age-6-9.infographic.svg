<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1342" width="900" height="1342" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">BC 省 1,200 元：6 岁生日到 9 岁生日前一天</title>
<desc id="d">BC 省培训与教育储蓄补助一次性 1,200，不需要供款；孩子和父母都是 BC 居民且有 SIN，经 RESP 机构在孩子 6 岁生日起到 9 岁生日前一天之间申请。</desc>
<rect width="900" height="1342" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · BC 省 BCTESG</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">BC 省 1,200 元：6 岁生日到 9 岁生日前一天</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">这笔钱一次性给 1,200，不用你先存钱；但只能在孩子 6 岁生日起到 9 岁生日前</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">一天之间，经 RESP 机构申请，过了就没了。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">谁能申请</text>
<rect x="40.0" y="362" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">孩子与父母</text>
<circle cx="64.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">申请时孩子和父母都住在 BC</text>
<circle cx="64.0" cy="449" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="454" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子和父母都有社会保险号（SIN）</text>
<rect x="459.0" y="362" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">出生日期</text>
<circle cx="483.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">2006 年 1 月 1 日及以后出生的孩子</text>
<circle cx="483.0" cy="449" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="454" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">2005 年及以前出生的不在范围内</text>
<rect x="40.0" y="494" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="527" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">怎么申请</text>
<circle cx="64.0" cy="551" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="556" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不能直接找政府，要由开 RESP 的机构代为提</text>
<text x="76.0" y="580" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">交</text>
<circle cx="64.0" cy="605" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="610" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子必须已经是某个 RESP 的受益人</text>
<rect x="459.0" y="494" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="527" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">选对机构</text>
<circle cx="483.0" cy="551" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="556" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不是每家机构都提供，ESDC 的机构名单逐家标</text>
<text x="495.0" y="580" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">明</text>
<circle cx="483.0" cy="605" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="610" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不提供的，转到提供的机构，或另开一个</text>
<text x="40" y="680" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">窗口只有三年</text>
<rect x="40" y="698" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="712" width="87.7" height="34" rx="17" fill="#12355B"/>
<text x="97.85" y="735" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">6 岁生日</text>
<text x="159.7" y="734" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">窗口打开</text>
<text x="159.7" y="760" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开了 RESP 也不会自动收到，要主动联系机构提交申请；最稳的做法是 6 岁生日当天就</text>
<text x="159.7" y="785" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">办。</text>
<rect x="40" y="818" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="832" width="102.7" height="34" rx="17" fill="#12355B"/>
<text x="105.35" y="855" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">9 岁前一天</text>
<text x="174.7" y="854" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">窗口最后一天</text>
<text x="174.7" y="880" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">满 9 岁那天就已经过了。「9 岁前」说的是 9 岁生日之前，不是 9 岁这一年之内。</text>
<rect x="40" y="913" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="927" width="88" height="34" rx="17" fill="#12355B"/>
<text x="98.0" y="950" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">错过之后</text>
<text x="160" y="949" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">基本拿不回来</text>
<text x="160" y="975" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">官方页面没有写延期或补申请的办法。</text>
<text x="40" y="1040" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">别漏掉的两件事</text>
<rect x="40.0" y="1058" width="401.0" height="162" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="58.0" y="1091" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">已宣布的变化</text>
<circle cx="64.0" cy="1115" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1120" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BC 省 2026 年预算写明：BCTESG 自 2028 年</text>
<text x="76.0" y="1144" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">4 月 1 日起终止</text>
<circle cx="64.0" cy="1169" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1174" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">过渡安排官方未详；孩子已满 6 岁的，尽早经</text>
<text x="76.0" y="1198" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">机构申请</text>
<rect x="459.0" y="1058" width="401.0" height="162" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="1091" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">联邦补助照常按年存</text>
<circle cx="483.0" cy="1115" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1120" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BCTESG 与联邦基本补助、学习债券可以叠加，</text>
<text x="495.0" y="1144" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">互不占额度</text>
<circle cx="483.0" cy="1169" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1174" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">6–9 岁有未用额度时，一年存 5,000 可拿</text>
<text x="495.0" y="1198" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">1,000 基本补助</text>
<text x="40" y="1259" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：BC 省政府《BC Training and Education Savings Grant》；canada.ca《RESP 能加多少钱》；BC 省 2026 年预算与财政</text>
<text x="40" y="1279" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">计划。</text>
<text x="40" y="1299" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
