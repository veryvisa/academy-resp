<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1278" width="900" height="1278" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">RESP 最常见的 5 个说法，哪些是错的？</title>
<desc id="d">五个流传很广的 RESP 说法与官方原文的对照：领补助不需要永居、16 至 17 岁的前置条件、BC 的 1,200 不需要供款、孩子不读书时的处置、取款不算父母收入。</desc>
<rect width="900" height="1278" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 常见说法对照</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">RESP 最常见的 5 个说法，哪些是错的？</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">五句流传很广的话，每一句都能用官方原文对一遍：领补助不需要永居，只是第一</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">个。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">说法与实情</text>
<rect x="40" y="362" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="376" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="399" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">误区 1</text>
<text x="146" y="398" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">「新移民要等拿到永居才能领补助」</text>
<text x="146" y="424" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不对。条件是孩子有 SIN、是加拿大税务居民；持工签、学签在加拿大生活的家庭同样算。</text>
<text x="146" y="449" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">额度从哪年算有两种口径，以机构查到的 ESDC 系统可用额度为准。</text>
<rect x="40" y="482" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="496" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="519" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">误区 2</text>
<text x="146" y="518" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">「17 岁之前存进去都有补助」</text>
<text x="146" y="544" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不一定。16、17 岁要拿补助，15 岁那年年底前须累计存满 2,000 且未取出，或任意 4</text>
<text x="146" y="569" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">个年度每年至少存 100。条件在 15 岁年底就定了。</text>
<rect x="40" y="602" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="616" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="639" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">误区 3</text>
<text x="146" y="638" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">「BC 的 1,200 要自己存钱配比，9 岁那年还来得及」</text>
<text x="146" y="664" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不对。BCTESG 一次性 1,200、不需要供款；窗口是 6 岁生日起到 9 岁生日前一天，要经</text>
<text x="146" y="689" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">机构申请。BC 省已宣布自 2028 年 4 月 1 日起终止。</text>
<rect x="40" y="722" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="736" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="759" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">误区 4</text>
<text x="146" y="758" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">「孩子不读书，钱就没了」或「反正能转 RRSP，没损失」</text>
<text x="146" y="784" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">两头都不对。本金免税拿回，补助退还；收益以 AIP 取出，按本人税率再加 20% 附加税</text>
<text x="146" y="809" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">（魁北克 12%）。转 RRSP 终身最多 50,000，要有 RRSP 额度，而且只是延税。</text>
<rect x="40" y="842" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="856" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="879" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">误区 5</text>
<text x="146" y="878" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">「从 RESP 取钱会算我的收入，影响牛奶金」</text>
<text x="146" y="904" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不会。补助和收益以教育援助金取出，算学生本人的收入；本金取回不算任何人的收入，父</text>
<text x="146" y="929" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">母的家庭净收入不变。</text>
<text x="40" y="994" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">带走的清单</text>
<rect x="40.0" y="1012" width="401.0" height="144" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="1045" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">现在就能做</text>
<circle cx="64.0" cy="1069" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1074" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子有 SIN 就开户，不必等永居</text>
<circle cx="64.0" cy="1099" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1104" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">请机构查一次 ESDC 系统里的可用额度</text>
<circle cx="64.0" cy="1129" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1134" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子 15 岁那年年底前，确认累计已存满 2,000</text>
<rect x="459.0" y="1012" width="401.0" height="144" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="1045" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">别急着做</text>
<circle cx="483.0" cy="1069" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1074" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BC 的孩子，6 岁生日后尽快申请 1,200</text>
<circle cx="483.0" cy="1099" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1104" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子没读书，先别关户；要关，先比较几条路</text>
<text x="40" y="1195" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：CRA《Who can become a beneficiary》《Payments from an RESP》；ESDC Infocapsule 12；canada.ca《RESP 能</text>
<text x="40" y="1215" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">加多少钱》；BC 省政府 BCTESG 页。</text>
<text x="40" y="1235" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
