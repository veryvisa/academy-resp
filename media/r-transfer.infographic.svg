<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1341" width="900" height="1341" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">换机构、转户：补助怎么带走？</title>
<desc id="d">同一受益人的 RESP 在机构之间转移，一般没有税务后果，补助和供款历史跟着转；手续由新机构发起，转之前要查原机构费用和集团计划的转出损失。</desc>
<rect width="900" height="1341" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 换机构、转户</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">换机构、转户：补助怎么带走？</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不会丢补助。同一个孩子的 RESP 从一家机构转到另一家，一般没有税务后果，补</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">助和供款历史跟着转；要盯的是手续、费用，和产品里的转出损失。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">转户四步</text>
<rect x="40" y="362" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="376" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="399" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 1 步</text>
<text x="150.1" y="398" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">先在新机构开同类型的 RESP</text>
<text x="150.1" y="424" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">受益人、开户人信息与原计划一致；家庭计划转家庭计划、个人计划转个人计划最省事。</text>
<rect x="40" y="457" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="471" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="494" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 2 步</text>
<text x="150.1" y="493" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">由新机构发起转户</text>
<text x="150.1" y="519" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">你填转户申请交给新机构，附原机构最近一期对账单；新机构与原机构之间再走完另外两</text>
<text x="150.1" y="544" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">张表。</text>
<rect x="40" y="577" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="591" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="614" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 3 步</text>
<text x="150.1" y="613" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">等待，一般几周</text>
<text x="150.1" y="639" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">碰上年底或原机构慢，可能一两个月。转户期间取不了钱；变现后转现金有空档期，资料</text>
<text x="150.1" y="664" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">一次交齐、提前定好要买的品种可以缩短。</text>
<rect x="40" y="697" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="711" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="734" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 4 步</text>
<text x="150.1" y="733" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">到账后逐项核对</text>
<text x="150.1" y="759" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">本金、基本补助、收益、学习债券、省补助各多少，与原机构最后一张对账单对一遍；再</text>
<text x="150.1" y="784" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">核对新机构记录的累计供款和已领补助。</text>
<text x="40" y="849" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">转之前先查</text>
<rect x="40.0" y="867" width="401.0" height="168" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="900" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">原机构的费用</text>
<circle cx="64.0" cy="924" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="929" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">转出费各家不同，看原机构的收费表</text>
<circle cx="64.0" cy="954" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="959" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">新机构有时愿意报销转出费，问一句不吃亏</text>
<circle cx="64.0" cy="984" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="989" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">基金有没有赎回费（常见于递延销售费方式买的</text>
<text x="76.0" y="1013" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">基金）</text>
<rect x="459.0" y="867" width="401.0" height="168" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="477.0" y="900" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">集团奖学金计划</text>
<circle cx="483.0" cy="924" r="3.2" fill="#B42318"/>
<text x="495.0" y="929" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">转出损失最大的一类：已交的销售费可能全部作</text>
<text x="495.0" y="953" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">废</text>
<circle cx="483.0" cy="978" r="3.2" fill="#B42318"/>
<text x="495.0" y="983" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">前几年转出，损失可能很大</text>
<circle cx="483.0" cy="1008" r="3.2" fill="#B42318"/>
<text x="495.0" y="1013" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">签字前先读合同里的转出条款</text>
<text x="40" y="1083" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">时机与省补助</text>
<rect x="40.0" y="1101" width="401.0" height="138" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="58.0" y="1134" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">别在这些时候转</text>
<circle cx="64.0" cy="1158" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1163" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子马上要取教育援助金的前几个月</text>
<circle cx="64.0" cy="1188" r="3.2" fill="#B7791F"/>
<text x="76.0" y="1193" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">年底前最后几周；打算年底前存一笔拿当年补助</text>
<text x="76.0" y="1217" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">的，先存完再转</text>
<rect x="459.0" y="1101" width="401.0" height="138" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="477.0" y="1134" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">BC 和魁北克</text>
<circle cx="483.0" cy="1158" r="3.2" fill="#B7791F"/>
<text x="495.0" y="1163" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">确认 BCTESG 随资产一起到了</text>
<circle cx="483.0" cy="1188" r="3.2" fill="#B7791F"/>
<text x="495.0" y="1193" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">魁北克的 QESI 并非每家机构都能处理，转之</text>
<text x="495.0" y="1217" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">前先确认</text>
<text x="40" y="1278" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《管理 RESP》；CRA《RESP 的支付与转移》；ESDC 机构公告 2012-482。</text>
<text x="40" y="1298" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
