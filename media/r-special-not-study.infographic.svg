<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1279" width="900" height="1279" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">孩子不上大学，RESP 的钱是不是白存了？</title>
<desc id="d">孩子不读书时：本金随时免税取回，补助退回政府，收益可以等一等、转给兄弟姐妹、以 AIP 取出或转进 RRSP；职业培训和学徒课程很多也算读书。</desc>
<rect width="900" height="1279" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 孩子不读书</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">孩子不上大学，RESP 的钱是不是白存了？</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">不是。本金一分不少、随时免税取回；受影响的只有补助和账户收益。职业培训、</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">学徒课程很多也算「读书」，先问机构能不能领教育援助金。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">先看：什么算「读书」</text>
<rect x="40.0" y="362" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">合格课程（全日制口径）</text>
<circle cx="64.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">专上程度，至少连续 3 周</text>
<circle cx="64.0" cy="449" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="454" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">每周课程时间不少于 10 小时</text>
<rect x="459.0" y="362" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="395" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">指定课程（非全日制口径）</text>
<circle cx="483.0" cy="419" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="424" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">专上程度，至少连续 3 周</text>
<circle cx="483.0" cy="449" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="454" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">每月课程时间不少于 12 小时</text>
<text x="40" y="524" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">真不读，四条路</text>
<rect x="40.0" y="542" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="575" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">等一等</text>
<circle cx="64.0" cy="599" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="604" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">最多可供款 31 年，账户最长开到第 35 年</text>
<circle cx="64.0" cy="629" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="634" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子哪天回头读书，照样领教育援助金</text>
<rect x="459.0" y="542" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="575" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">转给兄弟姐妹</text>
<circle cx="483.0" cy="599" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="604" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">补助不用退，收益也不用交附加税</text>
<circle cx="483.0" cy="629" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="634" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">接收方一般要未满 21 岁；学习债券不能转</text>
<rect x="40.0" y="674" width="401.0" height="138" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="58.0" y="707" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">本金取回，收益以 AIP 取出</text>
<circle cx="64.0" cy="731" r="3.2" fill="#B42318"/>
<text x="76.0" y="736" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">本金免税退还，补助退回政府</text>
<circle cx="64.0" cy="761" r="3.2" fill="#B42318"/>
<text x="76.0" y="766" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">收益按你的税率交税，再加 20% 附加税（魁北</text>
<text x="76.0" y="790" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">克 12%）</text>
<rect x="459.0" y="674" width="401.0" height="138" rx="14" fill="#E8F5EE" stroke="#1B7F4B" stroke-width="1.5"/>
<text x="477.0" y="707" font-size="19" fill="#1B7F4B" font-weight="700" text-anchor="start">收益转进 RRSP</text>
<circle cx="483.0" cy="731" r="3.2" fill="#1B7F4B"/>
<text x="495.0" y="736" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">要有 RRSP 额度，终身最多 50,000</text>
<circle cx="483.0" cy="761" r="3.2" fill="#1B7F4B"/>
<text x="495.0" y="766" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">当年不交普通所得税和附加税，将来从 RRSP</text>
<text x="495.0" y="790" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">取出时计税</text>
<text x="40" y="860" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">一张时间表</text>
<rect x="40" y="878" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="892" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="915" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">17 岁</text>
<text x="146" y="914" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">那年年底，基本补助停止增加</text>
<text x="146" y="940" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">这之后的供款不再配补助。</text>
<rect x="40" y="973" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="987" width="93.1" height="34" rx="17" fill="#12355B"/>
<text x="100.55" y="1010" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">满 9 年后</text>
<text x="165.1" y="1009" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">开满 9 年后、受益人满 21 岁且不在读</text>
<text x="165.1" y="1035" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">才轮到比较 AIP 和转 RRSP；在此之前先不要关户。</text>
<rect x="40" y="1068" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1082" width="121.0" height="34" rx="17" fill="#12355B"/>
<text x="114.5" y="1105" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 31、35 年</text>
<text x="193.0" y="1104" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">不能再供款、计划最迟结束</text>
<text x="193.0" y="1130" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开户后最多供款 31 年，第 35 年计划最迟要结束。</text>
<text x="40" y="1188" font-size="15" fill="#1F2A37" font-weight="400" text-anchor="start">孩子不在读合格课程时取本金，可能触发补助按比例退还，取之前先问机构。</text>
<text x="40" y="1216" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：CRA《Payments from an RESP》；canada.ca《管理 RESP》《用 RESP 支付教育费用》。</text>
<text x="40" y="1236" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
