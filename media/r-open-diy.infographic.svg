<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1438" width="900" height="1438" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">自己给孩子开 RESP：从办 SIN 到补助到账六步</title>
<desc id="d">自己开 RESP 的六步：办 SIN、选机构、选个人或家庭计划、勾上所有补助、问可用额度、设自动供款并年底核账。</desc>
<rect width="900" height="1438" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 自己开户</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">自己给孩子开 RESP：从办 SIN 到补助到账六步</text>
<rect x="40" y="166" width="820" height="98" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">开户本身不复杂；容易出错的是漏勾补助、没带照护人的 SIN、没问过可用额度。</text>
<text x="40" y="312" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">一步一步</text>
<rect x="40" y="330" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="344" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="367" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 1 步</text>
<text x="150.1" y="366" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">孩子和开户人都要有 SIN</text>
<text x="150.1" y="392" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有 SIN，机构可以开户但补助申请不了。工签、学签家庭的孩子拿 9 开头的临时 SIN，</text>
<text x="150.1" y="417" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">续签后记得更新。</text>
<rect x="40" y="450" width="820" height="133" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="464" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="487" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 2 步</text>
<text x="150.1" y="486" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">选机构，看它提供什么</text>
<text x="150.1" y="512" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">补助在哪开都一样；区别在能买什么、提供哪些补助、合同条款。基本补助、额外补助、</text>
<text x="150.1" y="537" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">学习债券、BCTESG 是否提供，以 ESDC 的机构名单为准。集团奖学金计划规则不同，签</text>
<text x="150.1" y="562" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">约前先读费用与退出条款。</text>
<rect x="40" y="595" width="820" height="133" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="609" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="632" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 3 步</text>
<text x="150.1" y="631" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">个人计划还是家庭计划</text>
<text x="150.1" y="657" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">个人计划只有一个受益人，不必有亲属关系。家庭计划可有多个受益人，须与每位开户人</text>
<text x="150.1" y="682" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">有血缘或收养关系，新加的受益人一般要未满 21 岁；兄弟姐妹之间基本补助可共用，学</text>
<text x="150.1" y="707" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">习债券不能。</text>
<rect x="40" y="740" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="754" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="777" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 4 步</text>
<text x="150.1" y="776" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">开户表里把补助都勾上</text>
<text x="150.1" y="802" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">补助不会因为开了户就自动来。基本补助、额外补助、学习债券和所在省的项目都要勾，</text>
<text x="150.1" y="827" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">需要照护人签名的地方要签；额外补助按报税结果自动判定。</text>
<rect x="40" y="860" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="874" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="897" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 5 步</text>
<text x="150.1" y="896" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">问一句「可用额度是多少」</text>
<text x="150.1" y="922" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">请机构查 ESDC 系统里的可用额度。有未用额度时，一年存 5,000 可拿 1,000；没有时</text>
<text x="150.1" y="947" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">存 2,500 拿 500，多存不多给。</text>
<rect x="40" y="980" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="994" width="78.1" height="34" rx="17" fill="#12355B"/>
<text x="93.05" y="1017" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">第 6 步</text>
<text x="150.1" y="1016" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">设自动供款，年底核一次账</text>
<text x="150.1" y="1042" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">补助按日历年算，12 月 31 日前存进去才算当年。设每月自动转账，年底看一眼补助是否</text>
<text x="150.1" y="1067" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">到账，对不上先问机构是否漏报了申请。</text>
<text x="40" y="1132" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">开户那天常被问到的三件事</text>
<rect x="40.0" y="1150" width="261.3333333333333" height="186" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="1183" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">要不要先存钱</text>
<circle cx="64.0" cy="1207" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1212" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">很多机构允许零余额开户，</text>
<text x="76.0" y="1236" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">再设自动转账</text>
<circle cx="64.0" cy="1261" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1266" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">学习债券不需要供款</text>
<rect x="319.3333333333333" y="1150" width="261.3333333333333" height="186" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="337.3333333333333" y="1183" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">开错机构能换吗</text>
<circle cx="343.3333333333333" cy="1207" r="3.2" fill="#2F5D8A"/>
<text x="355.3333333333333" y="1212" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">能。同一受益人的 RESP 在</text>
<text x="355.3333333333333" y="1236" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">机构之间转移，没有税务后</text>
<text x="355.3333333333333" y="1260" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">果</text>
<circle cx="343.3333333333333" cy="1285" r="3.2" fill="#2F5D8A"/>
<text x="355.3333333333333" y="1290" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">转出机构可能收手续费</text>
<rect x="598.6666666666666" y="1150" width="261.3333333333333" height="186" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="616.6666666666666" y="1183" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">钱的税务待遇</text>
<circle cx="622.6666666666666" cy="1207" r="3.2" fill="#2F5D8A"/>
<text x="634.6666666666666" y="1212" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">供款不能抵税，收益留在账</text>
<text x="634.6666666666666" y="1236" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">户里不计税</text>
<circle cx="622.6666666666666" cy="1261" r="3.2" fill="#2F5D8A"/>
<text x="634.6666666666666" y="1266" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">本金将来免税退回；终身供</text>
<text x="634.6666666666666" y="1290" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">款上限 50,000，超额每月</text>
<text x="634.6666666666666" y="1314" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">罚 1%</text>
<text x="40" y="1375" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《开 RESP 的步骤》《管理 RESP》《RESP 能加多少钱》；CRA《RESP 供款》；ESDC RESP 机构名单。</text>
<text x="40" y="1395" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
