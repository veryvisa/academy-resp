<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1309" width="900" height="1309" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">RESP 全景：从开户到取钱，先后顺序是什么？</title>
<desc id="d">RESP 要做的事分五段：开户、拿补助、打理、取钱、特殊情况；先记住四个数：补助是供款的 20%，一年最多 500，有未用额度时 1,000，终身 7,200，终身供款上限 50,000。</desc>
<rect width="900" height="1309" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" rx="0" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 全景</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">RESP 全景：从开户到取钱，先后顺序是什么？</text>
<rect x="40" y="166" width="820" height="130" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">先记住四个数</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">补助是供款的 20%，一年最多 500；有未用额度时一年最多 1,000；终身 7,200；</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">每个孩子终身供款上限 50,000。</text>
<text x="40" y="344" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">先后顺序</text>
<rect x="40" y="362" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="376" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="399" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">开户</text>
<text x="146" y="398" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">尽早开，孩子和开户人都要有 SIN</text>
<text x="146" y="424" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">没有 SIN 补助申请不了；开户表里把所有补助都勾上。</text>
<rect x="40" y="457" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="471" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="494" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">拿补助</text>
<text x="146" y="493" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">每年把补助拿满</text>
<text x="146" y="519" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">基本补助每年最多 500，有未用额度时 1,000，终身 7,200。收入低的家庭有额外补助和</text>
<text x="146" y="544" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不需要供款的学习债券；16、17 岁有 15 岁年底前的前置条件。</text>
<rect x="40" y="577" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="591" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="614" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">打理</text>
<text x="146" y="613" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">按入学时间把钱放稳</text>
<text x="146" y="639" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">离上学越近越要稳，比较费用。同一个孩子的 RESP 在机构之间转移，一般没有税务后果。</text>
<rect x="40" y="672" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="686" width="74" height="34" rx="17" fill="#12355B"/>
<text x="91.0" y="709" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">取钱</text>
<text x="146" y="708" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">上学时用最省税的方式取出</text>
<text x="146" y="734" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">补助和收益以教育援助金取出，算学生本人的收入；本金取回免税。</text>
<rect x="40" y="767" width="820" height="108" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="781" width="88" height="34" rx="17" fill="#12355B"/>
<text x="98.0" y="804" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">特殊情况</text>
<text x="160" y="803" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">孩子不读书、出国读、换受益人</text>
<text x="160" y="829" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">不读书：本金取回，补助退还，收益走 AIP 或转 RRSP；其他情形各有规则，不要在孩</text>
<text x="160" y="854" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">子十八岁那年就把计划关掉。</text>
<text x="40" y="919" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">每家情况不一样，先看这四点</text>
<rect x="40.0" y="937" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="970" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">孩子几岁才开始</text>
<circle cx="64.0" cy="994" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="999" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">15 岁年底前有 16、17 岁的门槛</text>
<circle cx="64.0" cy="1024" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1029" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BC 的孩子别漏 6–8 岁窗口的 1,200（已宣布</text>
<text x="76.0" y="1053" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">2028 年 4 月 1 日终止）</text>
<rect x="459.0" y="937" width="401.0" height="138" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="970" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">公民还是工签</text>
<circle cx="483.0" cy="994" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="999" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">身份不是关键</text>
<circle cx="483.0" cy="1024" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1029" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">孩子有 SIN、供款时是加拿大居民即可</text>
<rect x="40.0" y="1093" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="1126" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">住 BC 还是魁北克</text>
<circle cx="64.0" cy="1150" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1155" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">BC 有 BCTESG</text>
<circle cx="64.0" cy="1180" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="1185" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">魁北克有 QESI，终身最多 3,600</text>
<rect x="459.0" y="1093" width="401.0" height="114" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="477.0" y="1126" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">收入高还是低</text>
<circle cx="483.0" cy="1150" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1155" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">收入低的家庭可拿额外补助</text>
<circle cx="483.0" cy="1180" r="3.2" fill="#2F5D8A"/>
<text x="495.0" y="1185" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">还可拿不需要供款的学习债券</text>
<text x="40" y="1246" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：canada.ca《RESP 能加多少钱》《管理 RESP》；CRA《RESP 的支付》；BC 省 2026 年预算与财政计划。</text>
<text x="40" y="1266" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
