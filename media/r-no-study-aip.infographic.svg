<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1318" width="900" height="1318" role="img" aria-labelledby="t d" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif">
<title id="t">孩子没读书，RESP 里的钱怎么办？</title>
<desc id="d">把钱分成三块：本金免税拿回，补助退回政府，账户赚的收益作为 AIP 取出时要交税并另加 20%，或在额度内直接转进 RRSP。</desc>
<rect width="900" height="1318" fill="#FAFBFC"/>
<rect x="0" y="0" width="900" height="142" fill="#12355B"/>
<text x="40" y="46" font-size="18" fill="#BFD3E6" font-weight="500" text-anchor="start">RESP · 孩子不读书时</text>
<text x="40" y="92" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start">孩子没读书，RESP 里的钱怎么办？</text>
<rect x="40" y="166" width="820" height="136" rx="16" fill="#FFFFFF" stroke="#12355B" stroke-width="2"/>
<text x="64" y="198" font-size="17" fill="#0E7C7B" font-weight="700" text-anchor="start">一句话答案</text>
<text x="64" y="234" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">把钱分成三块：本金免税拿回，补助退回政府，账户赚的收益作为 AIP 取出时要</text>
<text x="64" y="266" font-size="21" fill="#1F2A37" font-weight="600" text-anchor="start">交税并另加 20%，或在额度内直接转进 RRSP。</text>
<text x="40" y="350" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">三块钱各怎么走</text>
<rect x="40.0" y="368" width="401.0" height="150" rx="14" fill="#E8F5EE" stroke="#1B7F4B" stroke-width="1.5"/>
<text x="58.0" y="401" font-size="19" fill="#1B7F4B" font-weight="700" text-anchor="start">本金</text>
<circle cx="64.0" cy="420" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="425" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">免税退还给供款人，不计入收入</text>
<circle cx="64.0" cy="450" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="455" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">随时可以取回，和收益分开处理</text>
<rect x="459.0" y="368" width="401.0" height="150" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="477.0" y="401" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">政府补助</text>
<circle cx="483.0" cy="420" r="3.2" fill="#B42318"/>
<text x="495.0" y="425" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">基本补助、学习债券退回政府</text>
<circle cx="483.0" cy="450" r="3.2" fill="#B42318"/>
<text x="495.0" y="455" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">家庭计划里基本补助可转给兄弟姐妹用（每人终身</text>
<text x="495.0" y="479" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">7,200 上限）；学习债券不能</text>
<text x="40" y="566" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">收益：累积收入支付（AIP）</text>
<rect x="40.0" y="584" width="401.0" height="180" rx="14" fill="#EAF1F8" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="58.0" y="617" font-size="19" fill="#2F5D8A" font-weight="700" text-anchor="start">什么时候能取</text>
<circle cx="64.0" cy="636" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="641" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">开户满 9 年后，且每位受益人都满 21 岁、不在</text>
<text x="76.0" y="665" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">读</text>
<circle cx="64.0" cy="690" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="695" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">或者计划已满 35 年</text>
<circle cx="64.0" cy="720" r="3.2" fill="#2F5D8A"/>
<text x="76.0" y="725" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">第一次付 AIP 后，次年 2 月底前要关户</text>
<rect x="459.0" y="584" width="401.0" height="180" rx="14" fill="#FFF4E0" stroke="#B7791F" stroke-width="1.5"/>
<text x="477.0" y="617" font-size="19" fill="#B7791F" font-weight="700" text-anchor="start">不转 RRSP 怎么交税</text>
<circle cx="483.0" cy="636" r="3.2" fill="#B7791F"/>
<text x="495.0" y="641" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">计入供款人当年收入，交普通所得税</text>
<circle cx="483.0" cy="666" r="3.2" fill="#B7791F"/>
<text x="495.0" y="671" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">再加 20% 附加税；魁北克居民是 12%，代替联邦</text>
<text x="495.0" y="695" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">的 20%</text>
<text x="40" y="812" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">转进 RRSP</text>
<rect x="40.0" y="830" width="401.0" height="156" rx="14" fill="#E8F5EE" stroke="#1B7F4B" stroke-width="1.5"/>
<text x="58.0" y="863" font-size="19" fill="#1B7F4B" font-weight="700" text-anchor="start">可以免掉附加税</text>
<circle cx="64.0" cy="882" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="887" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">转进你或配偶的 RRSP，终身上限 50,000</text>
<circle cx="64.0" cy="912" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="917" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">要有足够的 RRSP 供款额度</text>
<circle cx="64.0" cy="942" r="3.2" fill="#1B7F4B"/>
<text x="76.0" y="947" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">转入部分有等额 RRSP 扣除，不交 20% 附加税</text>
<rect x="459.0" y="830" width="401.0" height="156" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.5"/>
<text x="477.0" y="863" font-size="19" fill="#B42318" font-weight="700" text-anchor="start">别先取现再自己存</text>
<circle cx="483.0" cy="882" r="3.2" fill="#B42318"/>
<text x="495.0" y="887" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">不直接转入时，机构通常先预扣普通税和附加税</text>
<circle cx="483.0" cy="912" r="3.2" fill="#B42318"/>
<text x="495.0" y="917" font-size="16" fill="#1F2A37" font-weight="400" text-anchor="start">20% 附加税仍按 AIP 全额计算</text>
<text x="40" y="1034" font-size="22" fill="#12355B" font-weight="700" text-anchor="start">现在该做什么</text>
<rect x="40" y="1052" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1066" width="79.0" height="34" rx="17" fill="#12355B"/>
<text x="93.5" y="1089" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">先确认</text>
<text x="151.0" y="1088" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">AIP 的条件到了没有</text>
<text x="151.0" y="1114" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">开户满 9 年、受益人满 21 岁且不在读；孩子还可能回去读书的，可以先等等。</text>
<rect x="40" y="1147" width="820" height="83" rx="14" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<rect x="54" y="1161" width="79.0" height="34" rx="17" fill="#12355B"/>
<text x="93.5" y="1184" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">再算账</text>
<text x="151.0" y="1183" font-size="19" fill="#12355B" font-weight="700" text-anchor="start">查供款人和配偶的 RRSP 额度</text>
<text x="151.0" y="1209" font-size="17" fill="#1F2A37" font-weight="400" text-anchor="start">能转多少就请机构直接转进 RRSP，剩下的以 AIP 取出，挑收入低的年份。</text>
<text x="40" y="1268" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">依据：CRA《RESP 的支付》（payments-resp）；canada.ca《管理 RESP》。</text>
<text x="40" y="1288" font-size="13" fill="#5B6775" font-weight="400" text-anchor="start">一般性说明，不替你做税务或投资决定；个案以 ESDC、CRA 的核定和持牌专业人士的意见为准。</text>
</svg>
